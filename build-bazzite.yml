name: Build Custom Bazzite with Niri + Noctalia

on:
  push:
    branches: [main]
  schedule:
    # Build ogni giorno alle 3:00 UTC per catchare upstream updates
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bazzite-niri-noctalia

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate signing key
        run: |
          gpg --batch --gen-key <<EOF
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: Custom Bazzite
          Name-Email: custom@bazzite.local
          Expire-Date: 0
          %no-protection
          %commit
          EOF

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containerfiles/Containerfile.niri-noctalia
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate signed commit
        run: |
          git config user.name "Bazzite Auto Builder"
          git config user.email "builder@bazzite.local"
          echo "${{ github.sha }}" > .build-info
          git add .build-info
          git diff --cached --quiet || git commit -m "Build: ${{ github.sha }}"
          git push
